name: Prepare Singularity v17

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out build repository
        uses: actions/checkout@v4

      - name: Install source tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git

      - name: Fetch Singularity source
        run: |
          git clone \
            --branch event-horizon \
            --recurse-submodules \
            https://github.com/The-Anomalist/Singularity.git \
            kernel

      - name: Select KernelSU Next v3.4.2
        run: |
          cd kernel/KernelSU-Next

          git fetch \
            https://github.com/KernelSU-Next/KernelSU-Next.git \
            refs/tags/v3.4.2

          git checkout --detach FETCH_HEAD

          echo "Selected KernelSU Next revision:"
          git log -1 --oneline

      - name: Inspect kernel configuration
        run: |
          cd kernel

          echo "Kernel version:"
          make -s kernelversion

          echo "Available ARM64 configuration files:"
          find arch/arm64/configs -type f \
            \( -iname '*kona*' -o -iname '*oneplus*' \) \
            -print

          echo "Build-related files:"
          find . -maxdepth 2 -type f \
            \( -name '*build*.sh' \
            -o -name 'build.config*' \
            -o -name 'Makefile' \) \
            -print | head -100
