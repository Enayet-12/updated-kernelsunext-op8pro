name: Verify Singularity and KernelSU Next

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: singularity-ksunext-inspection
  cancel-in-progress: true

jobs:
  inspect:
    name: Inspect KernelSU Next and Singularity
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Install inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git findutils grep coreutils

      - name: Checkout Singularity
        run: |
          git clone \
            --branch event-horizon \
            --recurse-submodules \
            --depth 1 \
            https://github.com/The-Anomalist/Singularity.git \
            kernel

      - name: Verify KernelSU Next v3.4.2
        working-directory: kernel/KernelSU-Next
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "KERNELSU NEXT RELEASE VERIFICATION"
          echo "========================================"

          git fetch --force --tags \
            https://github.com/KernelSU-Next/KernelSU-Next.git \
            'refs/tags/v3.4.2:refs/tags/v3.4.2'

          if ! git rev-parse --verify \
            'refs/tags/v3.4.2^{commit}' >/dev/null; then
            echo "::error::KernelSU Next v3.4.2 tag was not found."
            exit 1
          fi

          TAG_COMMIT="$(git rev-parse 'refs/tags/v3.4.2^{commit}')"

          git checkout --detach "$TAG_COMMIT"

          HEAD_COMMIT="$(git rev-parse HEAD)"

          echo
          echo "Release tag: v3.4.2"
          echo "Tag commit:  $TAG_COMMIT"
          echo "HEAD commit: $HEAD_COMMIT"

          if [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
            echo "::error::Checked-out commit does not match v3.4.2."
            exit 1
          fi

          echo
          echo "Commit details:"
          git log -1 --format=fuller

          echo
          echo "Release verification passed."

      - name: Inspect Singularity build configuration
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "SINGULARITY SOURCE INFORMATION"
          echo "========================================"

          echo
          echo "Current commit:"
          git log -1 --oneline

          echo
          echo "Git submodules:"
          cat .gitmodules || true

          echo
          echo "Submodule status:"
          git submodule status || true

          echo
          echo "========================================"
          echo "BUILD SCRIPTS AND CONFIGURATION FILES"
          echo "========================================"

          find . -maxdepth 3 -type f \
            \( -name 'build.sh' \
            -o -name 'Makefile' \
            -o -name '*defconfig' \
            -o -name '*.config' \
            -o -name 'build.config*' \) \
            -print > /tmp/build-files.txt

          sed -n '1,200p' /tmp/build-files.txt

          echo
          echo "========================================"
          echo "ARM64 DEVICE CONFIGURATIONS"
          echo "========================================"

          if [ -d arch/arm64/configs ]; then
            find arch/arm64/configs -type f \
              \( -iname '*kona*' \
              -o -iname '*oneplus*' \
              -o -iname '*instantnoodlep*' \
              -o -iname '*sm8250*' \) \
              -print > /tmp/arm64-configs.txt

            if [ -s /tmp/arm64-configs.txt ]; then
              cat /tmp/arm64-configs.txt
            else
              echo "No matching configuration filenames found."
              echo "Listing configuration files for manual inspection:"
              find arch/arm64/configs -maxdepth 3 -type f \
                -print > /tmp/all-arm64-configs.txt
              sed -n '1,160p' /tmp/all-arm64-configs.txt
            fi
          else
            echo "arch/arm64/configs was not found at the repository root."
            echo "Inspecting repository directories:"
            find . -maxdepth 3 -type d \
              -path '*/arch/arm64/configs' \
              -print
          fi

          echo
          echo "========================================"
          echo "KERNELSU INTEGRATION REFERENCES"
          echo "========================================"

          git grep -n -i -E \
            'kernelsu|ksunext|ksu' \
            -- ':!KernelSU-Next' \
            > /tmp/ksu-references.txt || true

          if [ -s /tmp/ksu-references.txt ]; then
            sed -n '1,200p' /tmp/ksu-references.txt
          else
            echo "No tracked KernelSU references found outside the submodule."
          fi

          echo
          echo "========================================"
          echo "KERNEL VERSION INFORMATION"
          echo "========================================"

          if [ -f Makefile ]; then
            grep -n -E \
              '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)[[:space:]]*=' \
              Makefile || true
          else
            echo "No top-level kernel Makefile found."
          fi

          echo
          echo "Inspection completed."

      - name: Summarize inspected source revisions
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "INSPECTION SUMMARY"
          echo "========================================"

          if [ -d kernel/.git ]; then
            echo "Singularity checkout exists."
            git -C kernel log -1 --oneline || true
          fi

          if [ -d kernel/KernelSU-Next ]; then
            echo
            echo "KernelSU Next checkout:"
            git -C kernel/KernelSU-Next log -1 --oneline || true
            git -C kernel/KernelSU-Next describe \
              --tags --exact-match HEAD 2>/dev/null || true
          fi

          echo
          echo "No kernel compilation or artifact installation was performed."
