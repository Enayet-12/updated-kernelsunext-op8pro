name: Build Singularity - KernelSU Next v3.4.2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: singularity-kernel-build
  cancel-in-progress: false

jobs:
  build:
    name: Build OnePlus 8 Pro ARM64 Kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git bc bison flex \
            build-essential \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libssl-dev libelf-dev \
            libncurses-dev \
            python3 python3-pip \
            rsync cpio zip unzip \
            pahole

      - name: Checkout Singularity
        run: |
          git clone \
            --branch event-horizon \
            --recurse-submodules \
            --depth 1 \
            https://github.com/The-Anomalist/Singularity.git \
            kernel

      - name: Select KernelSU Next v3.4.2
        working-directory: kernel/KernelSU-Next
        shell: bash
        run: |
          set -euo pipefail

          git fetch --force --tags \
            https://github.com/KernelSU-Next/KernelSU-Next.git \
            'refs/tags/v3.4.2:refs/tags/v3.4.2'

          TAG_COMMIT="$(git rev-parse 'refs/tags/v3.4.2^{commit}')"

          git checkout --detach "$TAG_COMMIT"

          test "$(git rev-parse HEAD)" = "$TAG_COMMIT"

          echo "KernelSU Next tag: v3.4.2"
          echo "KernelSU Next commit: $TAG_COMMIT"

      - name: Identify kernel configuration
        id: config
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          echo "Available candidate defconfigs:"
          find arch/arm64/configs -type f \
            \( -iname '*kona*defconfig' \
            -o -iname '*sm8250*defconfig' \
            -o -iname '*instantnoodlep*defconfig' \) \
            -print | sort

          CONFIG=""

          for candidate in \
            vendor/kona-perf_defconfig \
            vendor/kona_defconfig \
            kona-perf_defconfig \
            kona_defconfig \
            vendor/instantnoodlep_defconfig \
            instantnoodlep_defconfig
          do
            if [ -f "arch/arm64/configs/$candidate" ]; then
              CONFIG="$candidate"
              break
            fi
          done

          if [ -z "$CONFIG" ]; then
            echo "::error::No recognized Kona/SM8250 defconfig found."
            echo "Review the candidate list above and select the correct config."
            exit 1
          fi

          echo "Selected defconfig: $CONFIG"
          echo "defconfig=$CONFIG" >> "$GITHUB_OUTPUT"

      - name: Verify kernel integration
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Kernel revision ====="
          git log -1 --oneline

          echo
          echo "===== Kernel version ====="
          grep -E \
            '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)[[:space:]]*=' \
            Makefile || true

          echo
          echo "===== KernelSU references ====="
          git grep -n -i -E \
            'KernelSU-Next/kernel|kernelsu|ksunext' \
            -- ':!KernelSU-Next' || true

          echo
          echo "===== KernelSU source ====="
          git -C KernelSU-Next log -1 --oneline

          echo
          echo "===== Selected defconfig ====="
          echo "${{ steps.config.outputs.defconfig }}"

      - name: Configure kernel
        working-directory: kernel
        shell: bash
        env:
          DEFCONFIG: ${{ steps.config.outputs.defconfig }}
        run: |
          set -euo pipefail

          make O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            "$DEFCONFIG"

          echo "===== KernelSU configuration ====="
          grep -E 'CONFIG_KSU|CONFIG_KPROBES|CONFIG_MODULES' \
            "$GITHUB_WORKSPACE/out/.config" || true

          echo "===== Device configuration ====="
          grep -E \
            'CONFIG_ARCH_QCOM|CONFIG_ARM64|CONFIG_OF=' \
            "$GITHUB_WORKSPACE/out/.config" || true

      - name: Compile kernel
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          make -j"$(nproc)" \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image.gz-dtb

      - name: Verify build artifacts
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Output files ====="
          find out/arch/arm64/boot -maxdepth 2 -type f -print

          IMAGE="out/arch/arm64/boot/Image.gz-dtb"

          if [ ! -s "$IMAGE" ]; then
            echo "::error::Image.gz-dtb was not produced."
            exit 1
          fi

          mkdir -p release
          cp "$IMAGE" release/Image.gz-dtb

          sha256sum release/Image.gz-dtb \
            | tee release/SHA256SUMS

          {
            echo "Singularity branch: event-horizon"
            echo "Device target: OnePlus 8 Pro (instantnoodlep)"
            echo "KernelSU Next tag: v3.4.2"
            echo "Kernel commit:"
            git -C kernel rev-parse HEAD
            echo "KernelSU Next commit:"
            git -C kernel/KernelSU-Next rev-parse HEAD
            echo "Defconfig: ${{ steps.config.outputs.defconfig }}"
          } > release/BUILD-INFO.txt

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: singularity-instantnoodlep-ksunext-v3.4.2
          path: release/
          if-no-files-found: error
          retention-days: 14
