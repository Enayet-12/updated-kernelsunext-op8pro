name: Build Singularity - KernelSU Next v3.4.2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: singularity-kernel-build
  cancel-in-progress: false

jobs:
  build:
    name: Build OnePlus 8 Pro ARM64 Kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git bc bison flex build-essential \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libssl-dev libelf-dev libncurses-dev \
            python3 python3-pip rsync cpio zip unzip pahole

      - name: Checkout Singularity
        shell: bash
        run: |
          set -euo pipefail
          git clone \
            --branch event-horizon \
            --recurse-submodules \
            --depth 1 \
            https://github.com/The-Anomalist/Singularity.git \
            kernel
          git -C kernel log -1 --oneline

      - name: Select KernelSU Next v3.4.2
        working-directory: kernel/KernelSU-Next
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags \
            https://github.com/KernelSU-Next/KernelSU-Next.git \
            'refs/tags/v3.4.2:refs/tags/v3.4.2'
          TAG_COMMIT="$(git rev-parse 'refs/tags/v3.4.2^{commit}')"
          git checkout --detach "$TAG_COMMIT"
          test "$(git rev-parse HEAD)" = "$TAG_COMMIT"
          echo "KernelSU Next commit: $TAG_COMMIT"

      - name: Identify kernel configuration
        id: config
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          find arch/arm64/configs -type f \
            \( -iname '*kona*defconfig' \
            -o -iname '*sm8250*defconfig' \
            -o -iname '*instantnoodlep*defconfig' \) \
            -print | sort

          CONFIG=""
          for candidate in \
            vendor/kona-perf_defconfig \
            vendor/kona_defconfig \
            kona-perf_defconfig \
            kona_defconfig \
            vendor/instantnoodlep_defconfig \
            instantnoodlep_defconfig
          do
            if [ -f "arch/arm64/configs/$candidate" ]; then
              CONFIG="$candidate"
              break
            fi
          done

          if [ -z "$CONFIG" ]; then
            echo "::error::No recognized device defconfig found."
            exit 1
          fi

          echo "Selected defconfig: $CONFIG"
          echo "defconfig=$CONFIG" >> "$GITHUB_OUTPUT"

      - name: Configure kernel
        working-directory: kernel
        shell: bash
        env:
          DEFCONFIG: ${{ steps.config.outputs.defconfig }}
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/out"

          make \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            "$DEFCONFIG"

      - name: Disable WERROR configuration
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="$GITHUB_WORKSPACE/out/.config"

          if grep -qE \
            '^(CONFIG_WERROR=|# CONFIG_WERROR is not set)' \
            "$CONFIG"; then
            scripts/config --file "$CONFIG" --disable WERROR

            make \
              O="$GITHUB_WORKSPACE/out" \
              ARCH=arm64 \
              CROSS_COMPILE=aarch64-linux-gnu- \
              olddefconfig
          fi

          grep -E '^(CONFIG_WERROR=|# CONFIG_WERROR is not set)' \
            "$CONFIG" || true

      - name: Compile kernel without warning errors
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          export KCFLAGS="-Wno-error"
          export CFLAGS_KERNEL="-Wno-error"
          export CFLAGS_MODULE="-Wno-error"

          make -j"$(nproc)" \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error" \
            CFLAGS_KERNEL="-Wno-error" \
            CFLAGS_MODULE="-Wno-error" \
            Image.gz-dtb

      - name: Verify kernel image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="out/arch/arm64/boot/Image.gz-dtb"

          if [ ! -s "$IMAGE" ]; then
            echo "::error::Kernel image was not generated."
            find out/arch/arm64/boot -maxdepth 2 -type f -print || true
            exit 1
          fi

          mkdir -p release
          cp "$IMAGE" release/Image.gz-dtb
          sha256sum release/Image.gz-dtb | tee release/SHA256SUMS

      - name: Record build information
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "Project: Singularity"
            echo "Branch: event-horizon"
            echo "Device: OnePlus 8 Pro (instantnoodlep)"
            echo "KernelSU Next: v3.4.2"
            echo "Singularity commit: $(git -C kernel rev-parse HEAD)"
            echo "KernelSU Next commit: $(git -C kernel/KernelSU-Next rev-parse HEAD)"
            echo "Defconfig: ${{ steps.config.outputs.defconfig }}"
            echo "Compiler: $(aarch64-linux-gnu-gcc --version | head -n 1)"
          } > release/BUILD-INFO.txt

          cat release/BUILD-INFO.txt

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: singularity-instantnoodlep-ksunext-v3.4.2
          path: release/
          if-no-files-found: error
          retention-days: 14
